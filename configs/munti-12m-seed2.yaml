# The real run: ~12.5M params, one free Kaggle T4 session.
out_dir: out-seed2
seed: 1338
device: null # null = cuda if available

model:
  vocab_size: 4096
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.0 # TinyStories is large relative to this model; we won't overfit
  bias: false
  learned_pos: true # flip to false for the ablation
  fast_attn: true # fused kernel on GPU; the manual path is the reference

batch_size: 64
max_steps: 20000
lr: 0.001 # small models tolerate a high LR
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
eval_every: 500 # also when checkpoints + progression samples are written
log_every: 100
